<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Velux - Premium Global Shipping Investment</title>
    
    <!-- Leaflet CSS for World Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        /* --- PREMIUM DARK THEME STYLING --- */
        body { margin: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #e2e8f0; overflow-x: hidden;}
        
        .app-container { display: flex; height: 100vh; width: 100vw; position: relative;}

        /* LEFT SIDE: THE MAP (Visualizer) */
        .map-section { 
            width: 65%; 
            position: relative; 
            background-image: url('https://cartodb-basemaps-a.global.ssl.fastly.net/dark_matter/9/{z}/{x}/{y}'); /* Dark Map Style */
            background-size: cover;
            transition: transform 0.3s ease;
        }

        #velux-map { width: 100%; height: 100%; z-index: 2;}

        /* RIGHT SIDE: DASHBOARD & CONTROLS */
        .dashboard {
            width: 35%;
            padding: 20px;
            background-color: rgba(15, 23, 42, 0.95);
            display: flex;
            flex-direction: column;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
            z-index: 3;
            overflow-y: auto;
        }

        h1 { color: #fbbf24; margin-bottom: 5px; font-weight: 800; text-transform: uppercase;}
        .subtitle { color: #94a3b8; font-size: 14px; margin-top: -5px;}

        /* STATUS CARDS */
        .status-card { background: linear-gradient(145deg, #1e293b, #334155); border-left: 6px solid #fbbf24; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);}
        
        /* SHIP LIST (Dynamic) */
        .ship-list-header { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 1px;}
        .ship-item { background-color: #e2e8f0; color: #334155; padding: 15px; margin-bottom: 10px; border-radius: 6px; cursor: pointer; transition: 0.3s; display:flex; justify-content:space-between; align-items:center;}
        .ship-item:hover, .ship-item.selected { background-color: #fbbf24; transform: scale(1.02); }
        
        /* INPUTS & BUTTONS */
        input[type="number"], textarea, select { width: 90%; padding: 12px; font-size: 16px; border: 1px solid #475569; background:#e2e8f0; color:black; border-radius: 6px; margin-bottom: 10px;}
        
        button.primary-btn { background-color: #3b82f6; color:white; border:none; padding: 15px 25px; font-size:16px; weight:bold; border-radius:8px; cursor:pointer; transition:0.3s;}
        button.primary-btn:hover { background-color: #2563eb; }
        button.action-btn { width: 100%; padding: 14px; font-weight:bold; text-transform uppercase;}

        .return-text { float:right; text-align:right; color:#eab308; font-weight:bold;}
        
        /* UPLOAD & BANK DETAILS */
        .bank-box, .upload-box { background: rgba(255,255,255,0.1); padding:10px; border-radius:4px; margin-top:5px;}
        
        /* WHATSAPP BUTTON (Floating) */
        .whatsapp-float { position: absolute; bottom: 30px; right: 30px; background-color: #25d366; color:white; width: 60px; height: 60px; border-radius: 50%; display:flex; justify-content:center; align-items:center;font-size:30px; box-shadow: 2px 2px 10px rgba(0,0,0,0.3); z-index:10;}

        /* MODAL/POPUP FOR SUCCESS */
        .modal-overlay { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999;}
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- LEFT SIDE: INTERACTIVE MAP -->
    <div class="map-section" id="velux-map-container"></div>

    <!-- RIGHT SIDE: DASHBOARD -->
    <div class="dashboard">
        
        <!-- Header & Support -->
        <h1>VELUX<span style="font-size:14px;color:#fff;">GLOBAL LOGISTICS</span></h1>
        <p class="subtitle">Secure • 48hr Delivery • Live Tracking • Premium Returns</p>

        <!-- 24/7 Customer Service Widget (Floating inside dashboard) -->
        <button onclick="openSupport()" style="background:#3b82f6; color:white; padding:5px 10px; font-size:12px; border-radius:20px; cursor:pointer; margin-bottom:10px; align-self:flex-start;">
            <i class="fas fa-headset"></i> Support ID: +91-8320651288
        </button>

        <!-- STATUS DISPLAY -->
        <div class="status-card">
            <strong><span id="current-status" style="color:green;">● SYSTEM READY</span></strong><br>
            <small>Welcome to Velux. Select a Ship & Load your Cargo.</small>
            <hr style="border-color:#475569; opacity:0.3;">
            
            <!-- Live Return Calculator -->
            <label style="font-size:13px;"><strong>Select Stake (₹):</strong></label>
            <input type="number" id="stake-input" placeholder="Min 5,000 | Max 10L" oninput="calculateReturn()">
            <div class="return-text"><strong>Potential Return:</strong> ₹<span id="est-return">---</span></div>
        </div>

        <!-- SHIP MARKETPLACE (Dynamic List) -->
        <h2 style="margin-top:20px; font-size:18px;">Live Ship Containers</h2>
        <p class="ship-list-header">Tap to select cargo & route</p>
        
        <div id="ship-container-display">
            <!-- Javascript will fill this -->
        </div>

        <!-- ACTION AREA: DEPOSIT / WITHDRAWAL FORMS (Hidden by default, show on click) -->
        
        <!-- 1. DEPOSIT FORM -->
        <div id="deposit-section" style="display:none; margin-top:auto; border-top:2px solid #fbbf24; padding-top:20px;">
            <h3><i class="fas fa-money-bill-wave"></i> Secure Deposit</h3>
            <input type="text" placeholder="Enter Amount to Deposit (₹)">
            
            <label style="font-size:13px;"><strong>Payment Details:</strong></label>
            <div class="bank-box">AC No.: 107016669282</div>
            <div class="bank-box">IFSC: GSCB0ADC014</div>
            
            <button onclick="submitDeposit()" class="primary-btn action-btn" style="background:#fbbf24; color:black;">Submit & Upload Proof</button>
        </div>

        <!-- 2. WITHDRAWAL FORM -->
        <div id="withdraw-section" style="display:none; margin-top:auto; border-top:2px solid #3b82f6; padding-top:20px;">
            <h3><i class="fas fa-hand-holding-usd"></i> Withdraw Profit</h3>
            <input type="number" placeholder="Enter Amount to Withdraw">
            
            <label style="font-size:13px;"><strong>Your Bank Details:</strong></label>
            <textarea rows="4" placeholder="Enter your Account No & IFSC..."></textarea>
            
            <button onclick="submitWithdraw()" class="primary-btn action-btn" style="background:#10b981;">Submit Request</button>
        </div>

    </div>

    <!-- WHATSAPP SUPPORT BUTTON -->
    <a href="https://wa.me/918320651288?text=Hello%20Velux%20Support..." class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- MODAL OVERLAY (For Animations) -->
    <div id="modal-overlay" class="modal-overlay"></div>

</div>

<!-- Leaflet JS Library -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// --- 1. CONFIGURATION & DATA ---
const ports = {
    mumbai: [19.0760, 72.8777], // Start - India
    dubai: [25.2048, 55.2708],   // Stopover/Midpoint (Gulf)
    london: [51.5074, -0.1278]   // End - Europe
};

// Ship Types with Returns Multipliers
const shipsData = [
    { id: 's1', name: "Onion Express", type: "Food/Agriculture", multiplier: 1.7, routeIndex: 0 }, 
    { id: 's2', name: "Mango Cruiser", type: "Fruit/Veg", multiplier: 1.75, routeIndex: 0 },
    { id: 's3', name: "Titan Ceramic", type: "Construction (Tiles)", multiplier: 2.2, routeIndex: 0 },
    { id: 's4', name: "Pharma Shipper", type: "Medical/Pharma", multiplier: 1.9, routeIndex: 0 },
    { id: 's5', name: "Silk Route", type: "Textile/Fashion", multiplier: 2.0, routeIndex: 0 },
    { id: 's6', name: "Spice Master", type: "Specialty Food", multiplier: 2.5, routeIndex: 0 } // High Risk/High Reward
];

let currentStake = 5000;
let selectedShipId = null;

// --- 2. INITIALIZE MAP & UI ---
const map = L.map('velux-map').setView([38, 48], 4); // Centered on India-Gulf-Midpoint view

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.{ext}', {
    attribution: '© OpenStreetMap', ext: 'png'
}).addTo(map);

// Draw the Main Path (India -> Dubai -> London)
const pathCoords = [ports.mumbai, ports.dubai, ports.london];
const shipPathLine = L.polyline(pathCoords, {color: '#fbbf24', weight: 5, opacity: 0.8}).addTo(map);

function initShipList() {
    const container = document.getElementById('ship-container-display');
    let html = '<div class="status-card" style="padding:10px; background:#e2e8f0;">Select a Container below to start your journey:</div>';
    
    shipsData.forEach(ship => {
        // Format Multiplier Text e.g., "Onion (1.7x)"
        html += `
            <div class="ship-item" onclick="selectShip('${ship.id}', ${ship.multiplier})">
                <div>
                    <strong>${ship.name}</strong><br>
                    <small style="color:#475569">${ship.type} | Est. Return: ${ship.multiplier * 100}% </small>
                </div>
                <i class="fas fa-ship"></i>
            </div>`;
    });

    container.innerHTML = html;
}

// --- 3. LOGIC: SELECT SHIP & CALCULATE RETURN ---
window.selectShip = function(id, mult) {
    selectedShipId = id; // Store ID (e.g., 's1') - In real app this matches database
    
    const shipItem = document.querySelector(`.ship-item[onclick*="${id.replace(/['"]/g, '')}]`); 
    if(shipItem) {
        document.querySelectorAll('.ship-item').forEach(e => e.style.background='#e2e8f0');
        shipItem.style.background = '#fbbf24';
        
        let name = shipsData.find(s=>s.id===id).name.split(' ')[0]; // Get base name like "Onion"
        alert(`✅ CONTAINER SELECTED!\n\nType: ${shipsData.find(s=>s.id===id).type}\nMultiplier: x${mult}`);
        
        calculateReturn(); // Auto-update calculator based on min stake 5k
        
        showDepositSection(); // Open deposit form automatically
    }
};

function calculateReturn() {
    const amount = document.getElementById('stake-input').value;
    if(amount > 0 && selectedShipId) {
        let mult = shipsData.find(s => s.id === selectedShipId).multiplier;
        let profit = (amount * mult) - amount;
        return.toFixed(2);
    } else {
        return '---';
    }
}

// --- 4. LOGIC: DEPOSIT / WITHDRAWAL HANDLING ---

window.submitDeposit = function() {
    const amt = document.getElementById('stake-input').value || "5,000"; // Default if empty
    
    alert(`✅ DEPOSIT REQUEST SENT!\n\nAmount to add: ₹${amt}\nDestination Account: 107016669282\nIFSC: GSCB0ADC014\n\nNow Upload Photo of Transaction (Screenshot/PDF) in the upload box below.`);
    
    // Simulate File Upload UI
    let fileInput = prompt("Enter filename or path for transaction photo (Demo):");
    console.log("File uploaded:", fileInput);
    
    showWithdrawSection(); // After deposit success, offer withdraw immediately
};

window.submitWithdraw = function() {
    const amt = prompt("How much do you want to withdraw?");
    alert(`✅ WITHDRAWAL REQUEST INITIATED!\nAmount: ₹${amt}\nStatus: Pending Admin Approval.\nTime Limit: 48 Hours after ship arrival.`);
};

function calculateReturn() {
    const amount = document.getElementById('stake-input').value;
    if(amount > 0 && selectedShipId) {
        let mult = shipsData.find(s => s.id === selectedShipId).multiplier;
        let returnVal = (amount * mult); // Total Amount including Principal + Profit
        document.getElementById('est-return').innerText = "₹" + returnVal.toLocaleString(); 
    } else {
        document.getElementById('est-return').innerText = "---";
    }
}

// Toggle Sections Helper Functions
window.showDepositSection = function() { document.getElementById('deposit-section').style.display='block'; };
window.openSupport = function() { alert("Connecting to WhatsApp Support: 8320651288..."); window.open("https://wa.me/918320651288", "_blank")};

// --- 5. MAP ANIMATION LOGIC (Smooth Travel) ---
let animationInterval;
function startSimulation(durationMs, pathIndex) {
    let currentPosIndex = 0; // Start at India
    
    if(pathIndex === 0 && pathCoords.length > 1){
        // Animation from Mumbai -> Dubai
        animateShipMove(ports.mumbai[0], ports.mumbai[1], ports.dubai[0], ports.dubai[1]);
        
        setTimeout(() => {
            alert("Reached Gulf Port! Loading Cargo...");
            // Continue to London/America logic could go here
            animateShipMove(ports.dubai[0], ports.dubai[1], ports.london[0], ports.london[1]); 
        }, durationMs); // Simulated speed (48h condensed for demo)
    } else if(pathIndex === 1) {
         // Animation from Dubai -> London
          animateShipMove(ports.dubai[0], ports.dubai[1], ports.london[0], ports.london[1]);
    }

}

function animateShipMove(fromLat, fromLng, toLat, toLng) {
    let latDiff = toLat - fromLat;
    let lngDiff = toLng - fromLng;
    
    function step() {
        // Linear Interpolation: Move fraction of the way every frame/interval (Simulating "dhire-dhire")
        let currentLat = fromLat + (latDiff * 0.03); 
        let currentLng = fromLng + (lngDiff * 0.03);

        shipMarker.setLatLng([currentLat, currentLng]); 
        
        requestAnimationFrame(step); 
    }

    let shipMarker = L.marker(ports.mumbai).addTo(map); // Re-use or create new marker
    
    setTimeout(() => finishShip(), 180000); // Finish after ~3 mins for demo (real is 48h)
}

function finishShip() {
    alert("🎉 SHIP ARRIVED SUCCESSFULLY! \n\nYour cargo has reached the destination port.\nPayout calculated automatically.");
}


// Initialize Everything on Load
initShipList();
let shipMarker; 

</script>

</body>
</html>
